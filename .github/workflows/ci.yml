name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  # Phase 7a (ADR D-029): the built web app is driven by Playwright against core's own results
  # for the same inputs, and every browser request must stay on the preview origin.
  web:
    name: Web app (Playwright, Chromium)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm build:web
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @passwerk/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: pnpm --filter @passwerk/web exec playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: pnpm --filter @passwerk/web exec playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  # Credibility gate 1 (ADR D-012): every emitted golden passport is replayed through the
  # official Python aas-test-engines; the verdict must agree with passwerk's L2 verdict, and
  # the committed report and badge must match the fresh run (only the Generated: line may differ).
  oracle:
    name: Oracle parity (aas-test-engines)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: uv sync --frozen
        working-directory: tools/oracle
      - run: pnpm oracle
      - name: Committed report and badge must match the fresh run
        run: |
          git diff --exit-code -- docs/conformance-badge.json
          git diff -I '^Generated: ' --exit-code -- docs/CONFORMANCE.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: oracle-parity
          path: |
            tools/oracle/out
            docs/CONFORMANCE.md
            docs/conformance-badge.json
          retention-days: 30

  # Credibility gate 2 (ADR D-013): the whole test suite runs inside a container with no
  # network at all. The image build installs dependencies with the network on.
  sovereignty:
    name: Sovereignty (--network none)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f tools/sovereignty/Dockerfile -t passwerk-sovereignty .
      - run: docker run --rm --network none passwerk-sovereignty
